name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  public:
  schedule:
    - cron: "23 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    # CodeQL Action is available for public repositories, or private
    # organization repositories licensed for GitHub Code Security. This
    # personal repository is intentionally kept private until final review.
    if: github.event.repository.private == false
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - if: matrix.language == 'java-kotlin'
        name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@bce182f857edf1feab116e9795a3393d21977282 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - if: matrix.build-mode == 'manual'
        name: Build Kotlin sources
        run: ./gradlew --no-daemon :app:compileDebugKotlin

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@bce182f857edf1feab116e9795a3393d21977282 # v4
