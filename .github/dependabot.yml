version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # CodeQL init/analyze must use the same action version.
      codeql:
        patterns:
          - "github/codeql-action/*"
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
